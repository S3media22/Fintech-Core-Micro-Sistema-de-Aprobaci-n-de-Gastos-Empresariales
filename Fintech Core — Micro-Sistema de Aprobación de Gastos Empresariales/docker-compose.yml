# Base de datos PostgreSQL para desarrollo local.
# Uso: docker compose up -d    (luego: npm run db:migrate)
services:
  db:
    image: postgres:16-alpine
    container_name: fintech-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech_dev_password
      POSTGRES_DB: fintech_core
    ports:
      - "5432:5432"
    volumes:
      - fintech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech_core"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fintech_pgdata:
